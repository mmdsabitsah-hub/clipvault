name: clipvault
description: ClipVault - Your Media. Your Control.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  # --- Added in later stages (uncomment when that stage starts) ---
  # sqflite: ^2.4.1            # Stage 3: local database
  # path_provider: ^2.1.5      # Stage 3: app directories
  # path: ^1.9.0
  # dio: ^5.7.0                # Stage 4: resumable HTTP downloads
  # flutter_local_notifications: ^18.0.1   # Stage 4: progress notifications
  # permission_handler: ^11.3.1            # Stage 4+: on-demand permissions
  # video_player: ^2.9.2 / just_audio: ^0.9.42   # Stage 3/6: playback
  # share_plus: ^10.1.2, open_filex: ^4.6.0      # Stage 3: share / open
  # firebase_core + cloud_firestore + firebase_auth  # Stage 7 (optional sync)
  # FFmpeg wrapper: ffmpeg_kit_flutter was retired upstream; pick a maintained
  # fork at Stage 6 and verify it supports your Flutter/AGP versions.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
